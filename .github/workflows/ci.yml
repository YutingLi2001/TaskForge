name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Ruff check
        run: |
          set -euo pipefail
          python -m ruff check backend/ 2>&1 | tee backend-ruff.log
        shell: bash
      - name: Backend tests
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee backend-tests.log
        shell: bash
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/taskforge_test
          SECRET_KEY: ci-test-secret
      - name: Backend coverage summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "coverage.xml"
          if not os.path.exists(path):
            print("coverage.xml not found; skipping summary.")
            raise SystemExit(0)

          root = ET.parse(path).getroot()
          line_rate = root.get("line-rate")
          if line_rate is None:
            print("coverage.xml missing line-rate; skipping summary.")
            raise SystemExit(0)

          pct = round(float(line_rate) * 100, 2)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("### Backend Coverage\n\n")
              handle.write(f"- Line coverage: **{pct}%**\n")
          PY
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            backend-ruff.log
            backend-tests.log

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Frontend lint
        run: |
          set -euo pipefail
          cd frontend && npm run lint 2>&1 | tee ../frontend-lint.log
        shell: bash
      - name: Frontend tests
        run: |
          set -euo pipefail
          cd frontend && npm run test -- --coverage 2>&1 | tee ../frontend-tests.log
        shell: bash
      - name: Frontend build
        run: |
          set -euo pipefail
          cd frontend && npm run build 2>&1 | tee ../frontend-build.log
        shell: bash
      - name: Frontend test typecheck
        run: |
          set -euo pipefail
          cd frontend && npm run typecheck:tests 2>&1 | tee ../frontend-typecheck-tests.log
        shell: bash
      - name: Frontend coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          path = "frontend/coverage/coverage-summary.json"
          if not os.path.exists(path):
            print("coverage-summary.json not found; skipping summary.")
            raise SystemExit(0)

          with open(path, "r", encoding="utf-8") as handle:
            data = json.load(handle)

          total = data.get("total", {})
          lines = total.get("lines", {}).get("pct")
          functions = total.get("functions", {}).get("pct")
          branches = total.get("branches", {}).get("pct")
          statements = total.get("statements", {}).get("pct")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("### Frontend Coverage\n\n")
              handle.write(f"- Lines: **{lines}%**\n")
              handle.write(f"- Functions: **{functions}%**\n")
              handle.write(f"- Branches: **{branches}%**\n")
              handle.write(f"- Statements: **{statements}%**\n")
          PY
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: |
            frontend-lint.log
            frontend-tests.log
            frontend-build.log
            frontend-typecheck-tests.log
